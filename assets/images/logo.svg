<svg width="1.7em" height="1.7em" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#2e4fb0"/>
      <stop offset="100%" stop-color="#13245c"/>
    </radialGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe6fa"/>
    </linearGradient>
    <path id="motif" d="M256 44 C264 44 271 52 271 61 C271 70 264 78 255 78 C247 78 242 73 242 65 C242 56 249 45 256 44 Z" fill="#a9c1ef" fill-opacity="0.8"/>
  </defs>

  <!-- background badge -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#b8cef2" stroke-width="2" stroke-opacity="0.55"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#b8cef2" stroke-width="1" stroke-opacity="0.35"/>

  <!-- ornamental ring, inspired by traditional Balinese pepatran motif -->
  <use href="#motif" transform="rotate(0 256 256)"/>
  <use href="#motif" transform="rotate(22.5 256 256)"/>
  <use href="#motif" transform="rotate(45 256 256)"/>
  <use href="#motif" transform="rotate(67.5 256 256)"/>
  <use href="#motif" transform="rotate(90 256 256)"/>
  <use href="#motif" transform="rotate(112.5 256 256)"/>
  <use href="#motif" transform="rotate(135 256 256)"/>
  <use href="#motif" transform="rotate(157.5 256 256)"/>
  <use href="#motif" transform="rotate(180 256 256)"/>
  <use href="#motif" transform="rotate(202.5 256 256)"/>
  <use href="#motif" transform="rotate(225 256 256)"/>
  <use href="#motif" transform="rotate(247.5 256 256)"/>
  <use href="#motif" transform="rotate(270 256 256)"/>
  <use href="#motif" transform="rotate(292.5 256 256)"/>
  <use href="#motif" transform="rotate(315 256 256)"/>
  <use href="#motif" transform="rotate(337.5 256 256)"/>

  <!-- meru silhouette (representasi atap pura/banjar, bertingkat tiga) -->
  <g>
    <polygon points="256,168 234,204 278,204" fill="url(#emblemGrad)"/>
    <rect x="233" y="204" width="46" height="4" fill="#13245c" fill-opacity="0.55"/>

    <polygon points="256,196 214,240 298,240" fill="url(#emblemGrad)"/>
    <rect x="212" y="240" width="88" height="4" fill="#13245c" fill-opacity="0.5"/>

    <polygon points="256,228 190,280 322,280" fill="url(#emblemGrad)"/>
    <rect x="188" y="280" width="136" height="4" fill="#13245c" fill-opacity="0.45"/>

    <!-- badan meru -->
    <rect x="205" y="284" width="102" height="42" fill="url(#emblemGrad)"/>
    <path d="M238 326 A18 18 0 0 1 274 326 Z" fill="#13245c" fill-opacity="0.5"/>

    <!-- pedestal -->
    <rect x="188" y="326" width="136" height="14" rx="3" fill="#dbe6fa"/>
  </g>

  <!-- lencana centang: simbol iuran terverifikasi/terbayar -->
  <circle cx="256" cy="368" r="27" fill="#ffffff"/>
  <circle cx="256" cy="368" r="27" fill="none" stroke="#13245c" stroke-width="2" stroke-opacity="0.15"/>
  <path d="M243 368 L252 378 L271 353" fill="none" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
